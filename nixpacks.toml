[phases.build]
# Disable Next.js cache by setting environment variable
cmds = ["NEXT_TELEMETRY_DISABLED=1 npm run build"]

[phases.setup]
# Ensure fresh node_modules
nixPkgs = ["nodejs_22", "npm-9_x", "openssl"]

[start]
# Use correct standalone server command
cmd = "node .next/standalone/server.js"

[options]
# Disable build caching
NO_CACHE = true
